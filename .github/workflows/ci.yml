name: CI

# Build and test the game-agnostic Core (with coverage) on every push and pull request.
# GitHub's cloud runners have no Vintage Story install, so CI runs the Core suite here; the
# full Mod project and the Atlas integration suite are gated locally by the opt-in pre-push
# hook, which uses this machine's install (see README). Running Atlas in cloud CI is feasible
# (download the server from the CDN) but deferred for a solo project — see the
# improve-testing-and-diagnosis design.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Core.Tests
        run: dotnet restore tests/Core.Tests/Core.Tests.csproj

      - name: Build Core.Tests
        run: dotnet build tests/Core.Tests/Core.Tests.csproj --configuration Release --no-restore

      # Collect Core line/branch coverage via the already-referenced coverlet.collector, so
      # there is a signal for what Core logic is untested. Core is the only suite that runs in
      # cloud CI (no game install), so this is the one cheap cloud coverage win; the Atlas suite
      # is gated locally by the pre-push hook (see README).
      - name: Test Core (with coverage)
        run: >-
          dotnet test tests/Core.Tests/Core.Tests.csproj
          --configuration Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      # Turn the raw cobertura XML into a human-readable report (HTML for download + a markdown
      # summary), so coverage is visible in the run itself, not just a file you have to fetch
      # and parse. ReportGenerator is the standard .NET coverage summarizer.
      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"Html;MarkdownSummaryGithub"

      # Surface the coverage table directly in the GitHub Actions run summary.
      - name: Write coverage to run summary
        if: always()
        run: |
          if [ -f ./coverage/report/SummaryGithub.md ]; then
            cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: |
            ./coverage/**/coverage.cobertura.xml
            ./coverage/report/**
          if-no-files-found: warn
